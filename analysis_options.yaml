include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # 前端原型参考目录，不参与本工程的静态分析。
    - example/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - unawaited_futures
